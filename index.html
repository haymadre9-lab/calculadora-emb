<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#C62828"/><link rel="manifest" href="manifest.webmanifest"/><link rel="apple-touch-icon" href="icon-192.png"/><title>Turnos + Calc EMB</title>
<style>
:root{--emb:#C62828;--emb-dark:#8E1F1F;--emb-soft:#FBEAEA;--bg:#F4F2EE;--surface:#FFFFFF;--line:#E3E0D8;--ink:#26241F;--muted:#6E6A62;--hint:#9A958B;--noct:#3949AB;--noct-soft:#E8EAF6;--dieta:#2E7D32;--dieta-soft:#E7F1E3;--m:#BBD8F6;--m-tx:#0C447C;--m-sat:#E6F1FB;--m-sat-tx:#185FA5;--t:#FBCE82;--t-tx:#7A4708;--t-sat:#FBEEDA;--t-sat-tx:#9A6411;--d:#DCD9D0;--d-tx:#46453F;--v:#C6E0A0;--v-tx:#2A5410;--v2:#A6E4D1;--v2-tx:#0A5040;--fnr:#F6C6C6;--fnr-tx:#7A1F1F;--sun:#FCE7E7;--sun-tx:#A32D2D;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom);}
header{background:var(--emb);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:30;}
header h1{font-size:17px;font-weight:700;margin:0;}
.periodbar{display:flex;align-items:center;gap:8px;margin-top:10px;}
.periodbar button{width:34px;height:32px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;}
.periodbar .plabel{flex:1;text-align:center;font-size:14px;font-weight:700;}
.periodbar .plabel small{display:block;font-size:11px;font-weight:600;opacity:.85;}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;}
.tabs button.on{color:var(--emb);border-bottom-color:var(--emb);}
.wrap{padding:12px;max-width:560px;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.bigrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);}
.bigrow:last-child{border-bottom:0;}
.bigrow .k{font-size:14px;color:var(--muted);}.bigrow .v{font-size:18px;font-weight:800;}
.bigrow .v small{font-size:12px;font-weight:600;color:var(--muted);}
.empty{text-align:center;color:var(--hint);padding:26px 10px;font-size:14px;}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.item:last-child{border-bottom:0;}
.item .d{width:42px;text-align:center;}.item .d b{font-size:16px;display:block;line-height:1;}
.item .d small{font-size:10px;color:var(--muted);text-transform:uppercase;}
.item .mid{flex:1;min-width:0;}.item .mid .t1{font-weight:700;font-size:14px;}.item .mid .t2{font-size:12px;color:var(--muted);}
.item .r{text-align:right;font-size:12px;}.item .r b{font-size:15px;}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;}
.chip.n{background:var(--noct-soft);color:var(--noct);}.chip.di{background:var(--dieta-soft);color:var(--dieta);}.chip.tn{background:var(--emb-soft);color:var(--emb-dark);}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--emb);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:800;box-shadow:0 6px 18px rgba(198,40,40,.4);cursor:pointer;z-index:25;}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:40;display:none;}.sheet-bg.show{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s;max-height:93vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-width:560px;margin:0 auto;}
.sheet.show{transform:translateY(0);}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}
.sheet h2{font-size:17px;margin:0 0 12px;font-weight:700;}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.fields .full{grid-column:1/-1;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:16px;background:var(--surface);color:var(--ink);font-family:inherit;}
.blq{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;position:relative;}
.blq .rm{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--emb);font-size:18px;cursor:pointer;font-weight:700;}
.blq .tramos{font-size:12px;color:var(--emb-dark);font-weight:700;margin-top:7px;}
.seg{display:flex;gap:6px;margin:8px 0 2px;}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:9px 4px;font-size:13px;font-weight:700;cursor:pointer;}
.seg button.on{background:var(--emb);color:#fff;border-color:var(--emb);}
.seg button:disabled{opacity:.35;cursor:not-allowed;}
.addbtn{width:100%;border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;}
.calcbox{background:var(--emb-soft);border-radius:10px;padding:11px 12px;margin:10px 0;display:flex;gap:18px;align-items:center;}
.calcbox span{font-size:12px;color:var(--muted);}.calcbox b{font-size:18px;display:block;color:var(--emb-dark);}
.calcbox .esp{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;max-width:120px;}
.diet{display:flex;gap:8px;margin:6px 0 2px;}
.diet label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;}
.diet input{width:18px;height:18px;}
.actions{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
.btn.primary{background:var(--emb);color:#fff;}.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
.btn.danger{background:transparent;color:var(--emb);border:1px solid var(--line);flex:0 0 auto;padding:13px 16px;}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;}

.calpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;}
.calrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}.calrow:last-child{margin-bottom:0;}
.callbl{font-size:13px;font-weight:700;color:var(--muted);}
#cal_year{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;padding:0 8px;}
#cal_type{flex:1;min-width:110px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;padding:0 10px;}
.calgrp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.calgrp button{border:0;background:var(--surface);width:34px;height:38px;font-size:18px;font-weight:700;color:var(--emb);cursor:pointer;}
.calgrp input{width:46px;height:38px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:15px;font-weight:800;color:var(--ink);background:var(--surface);}
.calseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.calseg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;}
.calseg button.on{background:var(--emb);color:#fff;}
.calstats{font-size:12px;color:var(--muted);font-weight:600;}
.calmonthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px;}
.calmtitle{font-size:18px;font-weight:800;color:var(--ink);}.calmtitle small{font-weight:600;color:var(--muted);font-size:13px;}
.calnav{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;}
.calnav:disabled{opacity:.35;}
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.calwk div{text-align:center;font-size:12px;font-weight:700;color:var(--hint);}.calwk div.we{color:var(--emb);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calday{min-height:58px;border-radius:9px;padding:4px 3px;position:relative;cursor:pointer;display:flex;flex-direction:column;}
.calday.empty{background:transparent!important;cursor:default;}
.calday .caln{font-size:11px;font-weight:700;opacity:.85;line-height:1;}
.calday .callab{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;}
.calday .calsub{font-size:10px;font-weight:800;text-align:center;background:rgba(255,255,255,.7);color:var(--emb);border-radius:5px;line-height:1.35;margin-top:1px;}
.calday.today{box-shadow:0 0 0 2px var(--ink);}
.calday.selmark{outline:3px solid var(--noct);outline-offset:-3px;}
.calday.apunt{box-shadow:inset 0 0 0 2px var(--emb);}
.calday.today.apunt{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--emb);}
.calhoy{text-align:center;margin:10px 0;}
.calhoybtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.callegend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:6px 0;font-size:11px;color:var(--muted);}
.callegend span{display:inline-flex;align-items:center;gap:5px;}
.callegend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.callegend i.apdot{box-shadow:inset 0 0 0 2px var(--emb);background:var(--surface);}

.calmini{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.calmini.on{background:var(--emb);color:#fff;border-color:var(--emb);}
.calpal{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin-top:4px;}
.calpal button{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;opacity:.55;}
.calpal button.on{opacity:1;box-shadow:0 0 0 2px var(--ink);}
.vtag{font-size:11px;font-weight:700;opacity:.75;vertical-align:middle;margin-left:6px;letter-spacing:.3px;}

function calDayInfo(m,d,code){const rule=CAL_TYPES[calType].rule;if(rule==="cl"){const c=clFor(calYear,m,d);if(c.vacio)return{show:"",ph:null,worked:false,cl:c.code};return{show:c.turno,ph:c.turno,worked:true,cl:c.code};}if(rule==="custom"){const w=(code==="M"||code==="T");return{show:code,ph:w?code:null,worked:w};}if(rule==="baked"){let worked=(code==="M"||code==="T");let show=worked?(calOff===1?calSwap(code):code):code;return{show,ph:worked?show:null,worked};}if(code==="T"){let p=(rule==="stint")?calPhaseMap[(m+1)+"-"+d]:calPhaseOf(m,d);const show=p===0?"M":"T";return{show,ph:show,worked:true};}return{show:code,ph:null,worked:false};}

function renderCalGrid(){
  calBuildPhaseMap();
  const av=CAL_TYPES[calType].months;
  if(!av.includes(calMonth))calMonth=av.includes(calToday.getMonth())?calToday.getMonth():av[av.length-1];

  const codes=calCodes();const m=calMonth;let mC=0,tC=0,html="";
  const lead=calMonIdx(m,1);

    const code=codes?codes[m][d-1]:null;const di=calDayInfo(m,d,code);const show=di.show,ph=di.ph,worked=di.worked,cl=di.cl;const wd=calDow(m,d);

    const f=calFecha(m,d);const reg=calRegFor(f);let sub="",apcls="";

  }

  document.querySelectorAll(".calday:not(.empty)").forEach(el=>el.onclick=()=>calDayTap(el.dataset.f));

  document.getElementById("cal_stats").innerHTML=(calType==="ESP"?("Especial &middot; <b>"+((espCur().name)||calGrp)+"</b> &middot; jornada "+(espCur().jor==="50"?"50%":"100%")+" &middot; "):(CAL_TYPES[calType].label+" &middot; grupo <b>"+calGrp+"</b> &middot; "))+CAL_MFULL[m]+": "+mC+" ma&ntilde;ana, "+tC+" tarde";
  const leg=[["var(--m)","Ma&ntilde;ana"],["var(--t)","Tarde"],["var(--sun)","Dom. trab."],["var(--d)","D franqueo"],["var(--v)","V vacac."],["var(--fnr)","FNR festivo"]];
  document.getElementById("cal_legend").innerHTML=leg.map(x=>"<span><i style='background:"+x[0]+"'></i>"+x[1]+"</span>").join("")+"<span><i class='apdot'></i>Apuntado</span>";

const ESPD={FOD:{lbl:"FOD \u2014 fiesta por otro d\u00eda",cor:"var(--dieta)",bg:"var(--dieta-soft)",bd:"#BFD8B6",resta:true},ENF:{lbl:"Enfermo (baja)",cor:"var(--emb)",bg:"var(--emb-soft)",bd:"#EFCACA",resta:false,jornada:true},MED:{lbl:"M\u00e9dico",cor:"var(--noct)",bg:"var(--noct-soft)",bd:"#C5CAE9",resta:false}};

function toMin(h){if(!h)return null;const[a,b]=h.split(":").map(Number);return a*60+b;}
function spanMin(i,f){const a=toMin(i),b=toMin(f);if(a==null||b==null)return 0;return b>=a?b-a:b+1440-a;}
function nightAbs(a,b){let t=0;for(const[w0,w1]of NIGHT)t+=Math.max(0,Math.min(b,w1)-Math.max(a,w0));return t;}
function turnoAvail(sd){return{1:!!(sd&&sd.t1),2:!!(sd&&sd.t2),P:!!(sd&&sd.t1&&sd.t2)};}
function turnoTramos(sd,t){if(!sd)return[];if(t==='1')return sd.t1?[sd.t1]:[];if(t==='2')return sd.t2?[sd.t2]:[];return[sd.t1,sd.t2].filter(Boolean);}
function bloqueTramos(b,tipo){if(b.man){return b.man.ini&&b.man.fin?[[b.man.ini,b.man.fin]]:[];}if(isGrupo(b.linea))return (jorGet(b.linea)[b.servicio]||[]).map(t=>[t[1],t[2]]);return turnoTramos(catSd(b.linea,tipo,b.servicio),b.turno);}

function diaCalc(tramos){let iv=tramos.map(([i,f])=>{let a=toMin(i),b=toMin(f);if(b<a)b+=1440;return[a,b];}).sort((x,y)=>x[0]-y[0]);let horas=0,noct=0,espera=0;for(let k=0;k<iv.length;k++){horas+=iv[k][1]-iv[k][0];noct+=nightAbs(iv[k][0],iv[k][1]);if(k>0){const g=iv[k][0]-iv[k-1][1];if(g>0&&g<60){horas+=g;espera+=g;}}}return{horas:horas/60,noct:noct/60,espera};}
function diaDietas(tramos){if(!tramos.length)return{desayuno:false,comida:false,cena:false};const iv=tramos.map(([i,f])=>{let a=toMin(i),b=toMin(f);if(b<a)b+=1440;return[a,b];});const earliest=Math.min(...iv.map(x=>x[0])),latest=Math.max(...iv.map(x=>x[1]));const turno=earliest<780?1:2;return{desayuno:turno===1&&earliest<270,comida:turno===1?latest>930:earliest<810,cena:latest>1470};}
function hhmm(dec){return (Math.round(dec*100)/100).toFixed(2).replace(".",",")+" h";}
function tLabel(t){return t==='1'?"T1":t==='2'?"T2":"Part";}

const JOR_STD=7.75,JOR_MIN=7;
/* Jornada segun contrato: 50% = media jornada y sin minimo garantizado */
function jorTipo(){if(typeof calType==="undefined")return "100";if(calType==="ESP"){try{return (espCur().jor==="50")?"50":"100";}catch(e){return "100";}}return (calType==="50")?"50":"100";}
function jorStd(){return jorTipo()==="50"?3.875:JOR_STD;}
function jorMin(){return jorTipo()==="50"?0:JOR_MIN;}
function totalAcum(){let a=0;for(const e of state.registro){const _k=espDia(e);if(_k){if(ESPD[_k].resta)a-=jorStd();continue;}const c=diaCalc(diaTramos(e));a+=Math.max(c.horas,jorMin())-jorStd();}return a+(+state.adj||0);}
function periodTotals(){let horas=0,noct=0,acum=0,nd=0,nc=0,nce=0,ndias=0,nsab=0,ndom=0,nfod=0,nfr=0,nenf=0,nmed=0;
for(const e of state.registro){if(!inPeriod(e.fecha))continue;const _k=espDia(e);if(_k){if(ESPD[_k].resta)acum-=jorStd();if(ESPD[_k].jornada){horas+=jorStd();ndias++;}if(_k==="FOD")nfod++;else if(_k==="ENF")nenf++;else if(_k==="MED")nmed++;continue;}ndias++;const c=diaCalc(diaTramos(e));if(c.horas>0){const _w=new Date(e.fecha+"T12:00:00").getDay();const _c=codeForFecha(e.fecha);if(_c==="FNR")ndom++;else if(_w===6)nsab++;else if(_w===0)ndom++;if(_c==="D")nfr++;}horas+=c.horas;noct+=c.noct;acum+=Math.max(c.horas,jorMin())-jorStd();const d=e.dietas||{};if(d.desayuno)nd++;if(d.comida)nc++;if(d.cena)nce++;}return{horas,noct,acum,nd,nc,nce,ndias,nsab,ndom,nfod,nfr,nenf,nmed};}
function fmtSaldo(d){d=Math.round(d*100)/100;return (d>=0?"+":"−")+Math.abs(d).toFixed(2).replace(".",",")+" h";}

function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("Copiado")).catch(()=>fallbackCopy(t));}else fallbackCopy(t);}
function fallbackCopy(t){const ta=document.getElementById("exp_t");if(ta){ta.select();ta.setSelectionRange(0,99999);try{document.execCommand("copy");toast("Copiado");}catch(e){toast("Copia manual");}}}
function bindBackup(){const e=document.getElementById("b_exp");if(!e)return;e.onclick=exportData;document.getElementById("b_imp").onclick=importData;
  const a=document.getElementById("adj_go");if(a)a.onclick=openAjuste;}
function modal(html){const old=document.getElementById("mdlx");if(old)old.remove();const m=document.createElement("div");m.id="mdlx";
  m.style.cssText="position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;";
  m.innerHTML=`<div style="background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px 14px 20px;max-height:90vh;overflow:auto">${html}</div>`;
  document.body.appendChild(m);m.onclick=ev=>{if(ev.target===m)m.remove();};return m;}
function cerrarModal(){const m=document.getElementById("mdlx");if(m)m.remove();}
function openAjuste(){
  const calc=totalAcum()-(+state.adj||0), act=totalAcum();
  modal(`<h2 style="margin:4px 0 6px;font-size:17px">Ajustar saldo total</h2>
   <p class="hint" style="margin:0 0 8px">La app ha calculado <b>${fmtSaldo(calc)}</b> con los d\u00edas apuntados. Si tu saldo real es otro, esc\u00edbelo y se guarda la diferencia.</p>
   <div class="fields"><div class="field"><label>Saldo real (h)</label><input id="aj_v" type="text" inputmode="decimal" value="${act.toFixed(2).replace(".",",")}" placeholder="ej. -12,50"></div></div>
   <div class="actions"><button class="btn ghost" id="aj_no">Cancelar</button><button class="btn ghost" id="aj_rs">Quitar ajuste</button><button class="btn primary" id="aj_ok">Guardar</button></div>`);
  document.getElementById("aj_no").onclick=cerrarModal;
  document.getElementById("aj_rs").onclick=()=>{state.adj=0;save();cerrarModal();render();toast("Ajuste quitado");};
  document.getElementById("aj_ok").onclick=()=>{const v=parseFloat((val("aj_v")||"").replace(",","."));if(isNaN(v)){toast("Pon un n\u00famero");return;}state.adj=Math.round((v-calc)*100)/100;save();cerrarModal();render();toast("Saldo total ajustado");};}
function openAplicar(){
  if(!calSel.length){toast("Elige d\u00edas en el calendario");return;}
  const ls=lineasAll();
  modal(`<h2 style="margin:4px 0 6px;font-size:17px">Poner servicio en ${calSel.length} d\u00eda${calSel.length===1?"":"s"}</h2>
   <p class="hint" style="margin:0 0 8px">Se usar\u00e1 el horario seg\u00fan el tipo de cada d\u00eda (laborable, s\u00e1bado o festivo).</p>
   <div class="fields"><div class="field"><label>L\u00ednea</label><select id="ap_l">${ls.map(l=>`<option value="${l}">${l}</option>`).join("")}</select></div>
   <div class="field"><label>Servicio</label><select id="ap_s"></select></div></div>
   <div class="fields"><div class="field"><label>Turno</label><select id="ap_t"><option value="1">Turno 1</option><option value="2">Turno 2</option><option value="P">Partida</option></select></div>
   <div class="field"><label>&nbsp;</label><div class="hint" style="margin:0">Los d\u00edas ya apuntados se saltan</div></div></div>
   <div class="actions"><button class="btn ghost" id="ap_no">Cancelar</button><button class="btn primary" id="ap_ok">Apuntar</button></div>`);
  const fillS=()=>{const l=val("ap_l");const set=new Set();["Lab","Sab","Fest"].forEach(t=>servsFor(l,t).forEach(s=>set.add(s)));
    document.getElementById("ap_s").innerHTML=[...set].sort().map(s=>`<option value="${s}">${s}</option>`).join("");};
  fillS();document.getElementById("ap_l").onchange=fillS;
  document.getElementById("ap_no").onclick=cerrarModal;
  document.getElementById("ap_ok").onclick=()=>{
    const l=val("ap_l"),s=val("ap_s"),tn=val("ap_t");let ok=0,skip=0,nod=0;
    for(const f of calSel.slice().sort()){
      if(state.registro.some(x=>x.fecha===f)){skip++;continue;}
      const tp=tipoForDate(f),sd=catSd(l,tp,s);
      if(!sd){nod++;continue;}
      const b={linea:l,servicio:s,turno:tn,man:null};
      const tr=bloqueTramos(b,tp); if(!tr.length){nod++;continue;}
      state.registro.push({id:uid(),fecha:f,tipo:tp,bloques:[b],dietas:diaDietas(tr),lab:l+"\u00b7"+s});ok++;}
    save();calSel=[];calMulti=false;cerrarModal();render();
    toast("Apuntados "+ok+(skip?" \u00b7 "+skip+" ya ten\u00edan":"")+(nod?" \u00b7 "+nod+" sin horario":""));};}
function backupName(){return "TurnosCalcEMB-"+new Date().toISOString().slice(0,10)+".json";}
async function shareBackup(json){
  const fn=backupName();
  /* 1) puente nativo del APK (guardar/compartir con Android) */
  try{ if(window.EMB && typeof window.EMB.saveBackup==="function"){ window.EMB.saveBackup(json,fn); toast("Elige d\u00f3nde guardarlo"); return; } }catch(e){}
  /* 2) compartir como archivo */
  try{
    if(navigator.canShare && navigator.share){
      const file=new File([json],fn,{type:"application/json"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Copia Turnos + Calc EMB"}); return; }
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  /* 3) descarga normal (navegador) */
  try{
    const b=new Blob([json],{type:"application/json"});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=fn;a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    toast("Guardado en Descargas");return;
  }catch(e){}
  /* 4) ultimo recurso: copiar */
  copyText(json); toast("No se pudo guardar: copiado al portapapeles");
}

  const json=JSON.stringify(Object.assign({},state,{esp:espData,cfg:{type:calType,grp:calGrp,off:calOff,year:calYear}}));
  openSheet(`<div class="grab"></div><h2>Exportar datos</h2>
   <p class="hint">Pulsa <b>Compartir / Guardar</b> para mandarlo a Drive, WhatsApp o guardarlo como archivo. También puedes copiar el texto.</p>
   <textarea id="exp_t" readonly style="width:100%;height:150px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;font-family:monospace;background:var(--bg);color:var(--ink)">${json.replace(/</g,"&lt;")}</textarea>
   <div class="actions"><button class="btn ghost" id="exp_cp">Copiar</button><button class="btn primary" id="exp_sh">Compartir / Guardar</button></div>`);
  document.getElementById("exp_cp").onclick=()=>copyText(json);
  document.getElementById("exp_sh").onclick=()=>shareBackup(json);
}
function importData(){
  openSheet(`<div class="grab"></div><h2>Importar datos</h2>
   <p class="hint">Pega aquí el texto exportado del otro móvil. <b>Reemplazará</b> tus datos actuales.</p>
   <textarea id="imp_t" placeholder="Pega aquí…" style="width:100%;height:150px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;font-family:monospace;background:var(--surface);color:var(--ink)"></textarea>
   <div class="actions"><button class="btn ghost" id="imp_file">Desde archivo</button><button class="btn primary" id="imp_go">Importar</button></div>
   <input type="file" id="imp_fl" accept=".json,application/json" style="display:none">`);
  document.getElementById("imp_file").onclick=()=>document.getElementById("imp_fl").click();
  document.getElementById("imp_fl").onchange=ev=>{const fl=ev.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{document.getElementById("imp_t").value=r.result;};r.readAsText(fl);};
  document.getElementById("imp_go").onclick=()=>{
    const txt=document.getElementById("imp_t").value.trim();if(!txt){toast("Pega los datos primero");return;}
    let d;try{d=JSON.parse(txt);}catch(e){toast("Texto no válido");return;}
    if(!d||!Array.isArray(d.registro)){toast("No es una copia válida");return;}
    doImport(d);
  };
}
function doImport(d){
  const n=(d.registro||[]).length;
  openSheet(`<div class="grab"></div><h2>¿Reemplazar tus datos?</h2>
   <p class="hint">La copia tiene <b>${n}</b> día${n===1?"":"s"} apuntado${n===1?"":"s"}. Esto <b>sustituirá</b> todo lo que tengas ahora en la app (días, servicios, jornadas y calendarios especiales). No se puede deshacer.</p>
   <div class="actions"><button class="btn ghost" id="imp_no">Cancelar</button><button class="btn danger" id="imp_si">Sí, reemplazar</button></div>`);
  document.getElementById("imp_no").onclick=closeSheet;
  document.getElementById("imp_si").onclick=()=>{
    state={registro:d.registro||[],serv:d.serv||{},jor:d.jor||{}};if(d.esp&&Array.isArray(d.esp.list)){espData=d.esp;CAL_TYPES.ESP.n=espData.list.length;espSave();}if(d.cfg&&CAL_TYPES[d.cfg.type]){calType=d.cfg.type;calGrp=Math.max(1,Math.min(CAL_TYPES[calType].n,d.cfg.grp||1));calOff=(d.cfg.off===1)?1:0;if(CAL_YEARS.includes(+d.cfg.year))calYear=+d.cfg.year;const _av=CAL_TYPES[calType].months;if(!_av.includes(calMonth))calMonth=_av.includes(calToday.getMonth())?calToday.getMonth():_av[0];calSave();}save();closeSheet();render();toast("Datos importados");
  };
}
function render(){
  const _vt=document.getElementById("vtag");if(_vt)_vt.textContent="v"+APP_VER;
  document.getElementById("plabel").innerHTML=periodLabel(period)+"<small>sabanilla</small>";
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const v=document.getElementById("view"),fab=document.getElementById("fab");
  document.querySelector(".periodbar").style.display=(tab==="calendario")?"none":"";
  if(tab==="calendario"){fab.style.display="none";v.innerHTML=viewCalendario();bindCal();renderCalGrid();return;}
  if(tab==="resumen"){fab.style.display="none";v.innerHTML=viewResumen();bindBackup();}
  else if(tab==="dias"){fab.style.display="";fab.textContent="+ Añadir día";v.innerHTML=viewDias();document.querySelectorAll("[data-eid]").forEach(el=>el.onclick=()=>editDia(el.dataset.eid));}
  else{fab.style.display="";fab.textContent=isGrupo(browseL)?"+ Nueva jornada":"+ Nuevo servicio";v.innerHTML=viewServicios();bindServicios();}
}

  <div class="bigrow"><span class="k">Horas trabajadas</span><span class="v">${hhmm(t.horas)}</span></div>
  <div class="bigrow"><span class="k">Horas acumuladas (saldo)</span><span class="v" style="color:${t.acum>=0?'var(--dieta)':'var(--emb)'}">${fmtSaldo(t.acum)}</span></div>
  <div class="bigrow"><span class="k">Franqueos trabajados<br><span class="hint" style="font-weight:600">descansos que has trabajado</span></span><span class="v" style="color:var(--noct)">${t.nfr}</span></div>

  <div class="bigrow"><span class="k">Horas nocturnas</span><span class="v">${hhmm(t.noct)}</span></div>
  <div class="bigrow"><span class="k">Días trabajados</span><span class="v">${t.ndias}</span></div>
  <div class="bigrow"><span class="k">FOD (fiesta por otro día)</span><span class="v">${t.nfod}</span></div>

  <p class="hint">Contadores del período 26→25. Cámbialo con las flechas de arriba.</p>
  <div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:4px">Copia de seguridad</div>
  <p class="hint" style="margin:0 0 10px">Guarda todos tus datos (días, servicios y jornadas) para pasarlos a otro móvil.</p>
  <div class="actions" style="margin-top:0"><button class="btn ghost" id="b_exp">Exportar</button><button class="btn primary" id="b_imp">Importar</button></div></div>`;}
function viewDias(){
  const list=state.registro.filter(e=>inPeriod(e.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(!list.length)return `<div class="empty">No hay días en este período.<br>Pulsa “+ Añadir día”.</div>`;
  let h="<div class='card'>";
  for(const e of list){const _k=espDia(e);if(_k){const dt2=new Date(e.fecha+"T12:00:00"),dn2=["DO","LU","MA","MI","JU","VI","SA"][dt2.getDay()];h+=`<div class="diarow" data-ed="${e.id}"><div class="dleft"><div class="dfecha">${dn2} ${e.fecha.slice(8,10)}/${e.fecha.slice(5,7)}</div><div class="dlab" style="color:${ESPD[_k].cor};font-weight:800">${ESPD[_k].lbl}</div></div><div class="dright"><div class="dhoras" style="color:${ESPD[_k].resta?"var(--emb)":"var(--ink)"}">${ESPD[_k].resta?fmtSaldo(-jorStd()):(ESPD[_k].jornada?hhmm(jorStd()):"")}</div></div></div>`;continue;}const c=diaCalc(diaTramos(e));const d=e.dietas||{};
    const dt=new Date(e.fecha+"T12:00:00"),dn=["DO","LU","MA","MI","JU","VI","SA"][dt.getDay()];
    let chips="";if(c.noct>0.01)chips+="<span class='chip n'>noct "+hhmm(c.noct)+"</span>";
    if(d.desayuno)chips+="<span class='chip di'>Des</span>";if(d.comida)chips+="<span class='chip di'>Com</span>";if(d.cena)chips+="<span class='chip di'>Cen</span>";
    const n=e.bloques.length,b0=e.bloques[0],l0=b0.man?(b0.man.l||b0.man.ini):(b0.linea+"·"+b0.servicio),lab=e.lab?e.lab:(l0+(n>1?" +"+(n-1):""));
    h+=`<div class="item" data-eid="${e.id}"><div class="d"><b>${dt.getDate()}</b><small>${dn}</small></div>
      <div class="mid"><div class="t1">${lab}</div><div class="t2">${chips||"&nbsp;"}</div></div>
      <div class="r"><b>${hhmm(c.horas)}</b></div></div>`;}
  return h+"</div>";}

function openSheet(html){document.getElementById("sheet").innerHTML=html;document.getElementById("sheetbg").classList.add("show");requestAnimationFrame(()=>document.getElementById("sheet").classList.add("show"));document.getElementById("sheetbg").onclick=closeSheet;}
function closeSheet(){document.getElementById("sheet").classList.remove("show");document.getElementById("sheetbg").classList.remove("show");}
function val(id){const e=document.getElementById(id);return e?e.value:"";}
function chk(id){const e=document.getElementById(id);return e?e.checked:false;}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1500);}
function defaultFecha(){const s=periodStart(period),t=new Date();const d=(t>=s&&t<=periodEnd(period))?t:s;return d.toISOString().slice(0,10);}

let E=null, manualDiet=false;
function editDia(id,fecha){
  E=id?JSON.parse(JSON.stringify(state.registro.find(x=>x.id===id))):{id:null,fecha:(fecha||defaultFecha()),tipo:"",bloques:[{linea:LINEAS[0],servicio:"",turno:"1",man:null}],dietas:null};
  if(!E.tipo)E.tipo=tipoForDate(E.fecha);
  manualDiet=!!(id&&E.dietas);
  // asegurar servicio inicial
  E.bloques.forEach(b=>{if(!b.man&&!b.servicio){const ss=servsFor(b.linea,E.tipo);b.servicio=ss[0]||"";const sd=catSd(b.linea,E.tipo,b.servicio);b.turno=sd&&sd.p?"P":(sd&&sd.t1?"1":"2");}});
  openSheet(`<div class="grab"></div><h2>${id?"Editar":"Añadir"} día</h2>
    <div class="fields"><div class="field"><label>Fecha</label><input id="f_fecha" type="date" value="${E.fecha}"/></div>
    <div class="field"><label>Tipo de día</label><select id="f_tipo"></select></div></div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 6px">Servicios del día</div>
    <div id="bloques"></div>
    <button class="addbtn" id="addb">+ Añadir otro servicio</button>
    <div class="calcbox"><div><span>Horas</span><b id="c_h">0h 00m</b></div><div><span>Nocturnas</span><b id="c_n">0h 00m</b></div><div class="esp" id="c_e"></div></div>
    <div id="dietwrap"></div>
    <div class="actions">${id?'<button class="btn danger" id="e_del">Borrar</button>':''}<button class="btn ghost" id="e_cancel">Cancelar</button><button class="btn primary" id="e_save">Guardar</button></div>`);
  const fTipo=document.getElementById("f_tipo"),fFecha=document.getElementById("f_fecha");
  function fillTipos(){const L=Object.assign({},TIPOL);Object.keys(ESPD).forEach(k=>L[k]=ESPD[k].lbl);const cur=espDia(E)||E.tipo;fTipo.innerHTML=["Lab","Sab","Fest","FOD","ENF","MED"].map(t=>`<option value="${t}" ${t===cur?"selected":""}>${L[t]}</option>`).join("");}
  fillTipos();
  fFecha.onchange=()=>{E.fecha=fFecha.value;if(!id){E.tipo=tipoForDate(E.fecha);fillTipos();}renderBloques();};
  fTipo.onchange=()=>{if(ESPD[fTipo.value]){E.esp=fTipo.value;E.fod=(fTipo.value==="FOD");E.dietas={desayuno:false,comida:false,cena:false};manualDiet=true;renderBloques();return;}E.esp=null;E.fod=false;E.tipo=fTipo.value;E.bloques.forEach(b=>{if(!b.man){const ss=servsFor(b.linea,E.tipo);if(!ss.includes(b.servicio))b.servicio=ss[0]||"";}});renderBloques();};
  document.getElementById("addb").onclick=()=>{E.bloques.push({linea:E.bloques[E.bloques.length-1].linea,servicio:"",turno:"1",man:null});const b=E.bloques[E.bloques.length-1];const ss=servsFor(b.linea,E.tipo);b.servicio=ss[0]||"";const sd=catSd(b.linea,E.tipo,b.servicio);b.turno=sd&&sd.p?"P":(sd&&sd.t1?"1":"2");renderBloques();};
  document.getElementById("e_cancel").onclick=closeSheet;
  if(document.getElementById("e_del"))document.getElementById("e_del").onclick=()=>{state.registro=state.registro.filter(x=>x.id!==E.id);save();closeSheet();render();toast("Día borrado");};
  document.getElementById("e_save").onclick=()=>{
    E.fecha=fFecha.value;if(!E.fecha){toast("Pon la fecha");return;}
    if(espDia(E)){const k=espDia(E);E.esp=k;E.fod=(k==="FOD");E.bloques=[];E.dietas={desayuno:false,comida:false,cena:false};E.lab=ESPD[k].lbl;}
    else{const tr=diaTramos(E);if(!tr.length){toast("Falta el horario de alg\u00fan servicio");return;}
    E.dietas={desayuno:chk("e_des"),comida:chk("e_com"),cena:chk("e_cen")};}
    if(!E.id)E.id=uid();
    const idx=state.registro.findIndex(x=>x.id===E.id);
    if(idx>=0)state.registro[idx]=E;else state.registro.push(E);
    save();if(!inPeriod(E.fecha))period=periodFromDate(E.fecha);closeSheet();render();toast("Guardado");
  };
  renderBloques();
}
function openSaveServ(i){
  const b=E.bloques[i]; if(!b||!b.man)return;

  mdl.style.cssText="position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;";
  mdl.innerHTML=`<div style="background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px 14px 20px;max-height:90vh;overflow:auto">

   <div class="fields"><div class="field"><label>Tipo de d\u00eda</label><select id="sv_t">${tipos.map(t=>`<option value="${t}">${t}</option>`).join("")}</select></div>
   <div class="field"><label>&nbsp;</label><div class="hint" style="margin:0">Se guarda para ese tipo de d\u00eda</div></div></div>
   <div class="fields"><div class="field"><label>Inicio</label><input type="time" id="sv_i" value="${b.man.ini||""}"></div>
   <div class="field"><label>Fin</label><input type="time" id="sv_f" value="${b.man.fin||""}"></div></div>

  document.body.appendChild(mdl);

  mdl.onclick=e=>{if(e.target===mdl)cerrar();};
  document.getElementById("sv_ok").onclick=()=>{
    const l=(val("sv_l")||"").trim(), s=(val("sv_s")||"").trim(), t=val("sv_t"), ini=val("sv_i"), fin=val("sv_f");
    if(!l||!s){toast("Pon l\u00ednea y servicio");return;}
    if(!ini||!fin){toast("Pon las horas");return;}
    const key=l+"|"+t+"|"+s; const prev=state.serv[key]||{};
    state.serv[key]=Object.assign({},prev,{t1:[ini,fin]});
    save(); cerrar();
    if(E.tipo===t){E.bloques[i]={linea:l,servicio:s,turno:"1"};}
    renderBloques(); toast("Guardado: "+l+" \u00b7 "+s+" ("+t+")");
  };
}

    const sd=catSd(b.linea,E.tipo,b.servicio),av=turnoAvail(sd);
    const body=`<div class="seg" data-seg="${i}">

  cont.querySelectorAll("[data-srv]").forEach(el=>el.onchange=()=>{const i=+el.dataset.srv;if(isGrupo(E.bloques[i].linea)){E.bloques[i].servicio=el.value;manualDiet=false;renderBloques();return;}if(el.value==="__man__"){E.bloques[i].man={ini:"",fin:""};}else{E.bloques[i].man=null;E.bloques[i].servicio=el.value;const sd=catSd(E.bloques[i].linea,E.tipo,el.value);E.bloques[i].turno=sd&&sd.p?"P":(sd&&sd.t1?"1":"2");}manualDiet=false;renderBloques();});
  cont.querySelectorAll("[data-seg]").forEach(seg=>seg.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{if(btn.disabled)return;const i=+seg.dataset.seg;E.bloques[i].turno=btn.dataset.t;manualDiet=false;renderBloques();}));
  cont.querySelectorAll("[data-rm]").forEach(el=>el.onclick=()=>{E.bloques.splice(+el.dataset.rm,1);manualDiet=false;renderBloques();});
  cont.querySelectorAll("[data-ml]").forEach(el=>el.oninput=()=>{E.bloques[+el.dataset.ml].man.l=el.value;});
  cont.querySelectorAll("[data-save]").forEach(el=>el.onclick=()=>openSaveServ(+el.dataset.save));
  cont.querySelectorAll("[data-tocat]").forEach(el=>el.onclick=()=>{const i=+el.dataset.tocat;E.bloques[i]={linea:LINEAS[0],servicio:"",turno:"1",man:null};const ss=servsFor(LINEAS[0],E.tipo);E.bloques[i].servicio=ss[0]||"";const sd=catSd(LINEAS[0],E.tipo,E.bloques[i].servicio);E.bloques[i].turno=sd&&sd.p?"P":(sd&&sd.t1?"1":"2");manualDiet=false;renderBloques();});
  cont.querySelectorAll("[data-mi]").forEach(el=>el.onchange=()=>{E.bloques[+el.dataset.mi].man.ini=el.value;manualDiet=false;recompute();});
  cont.querySelectorAll("[data-mf]").forEach(el=>el.onchange=()=>{E.bloques[+el.dataset.mf].man.fin=el.value;manualDiet=false;recompute();});

function recompute(){
  const tr=diaTramos(E),c=diaCalc(tr);
  const ch=document.getElementById("c_h");if(!ch)return;
  ch.textContent=hhmm(c.horas);document.getElementById("c_n").textContent=hhmm(c.noct);
  document.getElementById("c_e").textContent=c.espera>0?("incluye "+hhmm(c.espera/60)+" de espera (<1h)"):"";
  const base=manualDiet&&E.dietas?E.dietas:diaDietas(tr);
  document.getElementById("dietwrap").innerHTML=`<label style="font-size:12px;color:var(--muted);font-weight:600;">Dietas (automáticas, editables)</label>
    <div class="diet"><label><input type="checkbox" id="e_des" ${base.desayuno?"checked":""}> Desayuno</label><label><input type="checkbox" id="e_com" ${base.comida?"checked":""}> Comida</label><label><input type="checkbox" id="e_cen" ${base.cena?"checked":""}> Cena</label></div>`;
  ["e_des","e_com","e_cen"].forEach(id=>document.getElementById(id).onchange=()=>{manualDiet=true;E.dietas={desayuno:chk("e_des"),comida:chk("e_com"),cena:chk("e_cen")};});
}
let browseL=LINEAS[0],browseT="Lab";
function isGrupo(l){return l==="3197"||l==="3198";}
const IMPBTN='<button class="addbtn" id="impcat" style="margin-bottom:10px;border-style:solid;border-color:var(--noct);color:var(--noct)">\u2b06 Importar catálogo (CSV)</button>';
function csvParse(text){text=text.replace(/^\uFEFF/,'');const lines=text.split(/\r\n|\n|\r/).filter(l=>l.trim()!=='');if(!lines.length)return{head:[],rows:[]};const d=(lines[0].split(';').length>lines[0].split(',').length)?';':',';const p=l=>l.split(d).map(c=>c.replace(/^"|"$/g,'').trim());return{head:p(lines[0]),rows:lines.slice(1).map(p)};}
function normTime(v){if(!v)return'';v=(''+v).trim();const m=v.match(/(\d{1,2}):(\d{2})/);if(m)return String(+m[1]).padStart(2,'0')+':'+m[2];const fl=parseFloat(v.replace(',','.'));if(!isNaN(fl)&&fl>0&&fl<1){const mm=Math.round(fl*1440);return String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');}return v;}
function importCatFile(text,acc){
  const o=csvParse(text);const H=o.head.map(x=>x.toLowerCase());
  if(H.some(x=>x.indexOf('servicio')>=0)&&H.some(x=>x.indexOf('t1')>=0)){
    for(const r of o.rows){const lin=(r[0]||'').trim(),tipo=(r[1]||'Lab').trim(),serv=(r[2]||'').trim();if(!lin||!serv)continue;
      const sd={p:(r[7]&&/s[ií]|^1$|x/i.test((r[7]||'').trim()))?1:0};const a1=normTime(r[3]),b1=normTime(r[4]),a2=normTime(r[5]),b2=normTime(r[6]);
      if(a1&&b1)sd.t1=[a1,b1];if(a2&&b2)sd.t2=[a2,b2];if(!sd.t1&&!sd.t2)continue;
      state.serv[lin+'|'+tipo+'|'+serv]=sd;acc.s++;}
  }else if(H.some(x=>x.indexOf('jornada')>=0)){
    const map={};for(const r of o.rows){const g=(r[0]||'').trim(),jn=(r[1]||'').trim();if(!g||!jn)continue;const k=g+'||'+jn;(map[k]=map[k]||[]).push([parseInt(r[2])||0,(r[3]||'').trim(),normTime(r[4]),normTime(r[5])]);}
    for(const k of Object.keys(map)){const g=k.split('||')[0],jn=k.split('||')[1];const arr=map[k].sort((a,b)=>a[0]-b[0]).map(x=>[x[1],x[2],x[3]]).filter(x=>x[1]&&x[2]);if(arr.length){state.jor[g]=state.jor[g]||{};state.jor[g][jn]=arr;acc.j++;}}
  }else acc.bad++;
}
function openImportCat(){
  openSheet(`<div class="grab"></div><h2>Importar catálogo</h2>
   <p class="hint">Edita el Excel y guarda cada hoja como <b>CSV</b> (Excel: Archivo › Guardar como › CSV. Google Sheets: Archivo › Descargar › CSV). Luego elige aquí los CSV (puedes seleccionar los dos a la vez).</p>
   <p class="hint">La app detecta sola si es la hoja de Servicios o la de Jornadas, y <b>reemplaza</b> esos datos con los del archivo. Entra en la copia de seguridad.</p>
   <input type="file" id="impcatf" accept=".csv,text/csv,text/plain" multiple style="display:none">
   <div class="actions"><button class="btn ghost" id="impcat_c">Cancelar</button><button class="btn primary" id="impcat_go">Elegir CSV</button></div>`);
  document.getElementById("impcat_c").onclick=closeSheet;
  document.getElementById("impcat_go").onclick=()=>document.getElementById("impcatf").click();
  document.getElementById("impcatf").onchange=ev=>{const files=[...ev.target.files];if(!files.length)return;const acc={s:0,j:0,bad:0};let done=0;
    files.forEach(fl=>{const r=new FileReader();r.onload=()=>{try{importCatFile(r.result,acc);}catch(e){acc.bad++;}done++;if(done===files.length){save();closeSheet();render();toast("Importado: "+acc.s+" servicios, "+acc.j+" jornadas"+(acc.bad?" ("+acc.bad+" no reconocidos)":""));}};r.onerror=()=>{acc.bad++;done++;if(done===files.length){save();closeSheet();render();toast("Importado: "+acc.s+" servicios, "+acc.j+" jornadas");}};r.readAsText(fl);});};
}
function viewServicios(){

  const lopts=allL.map(l=>`<option value="${l}" ${browseL===l?"selected":""}>${l}${isGrupo(l)?" (grupo)":""}</option>`).join("");

    const j=jorGet(browseL);const ks=Object.keys(j).sort();
    let rows=ks.map(name=>{const tr=j[name].map(t=>[t[1],t[2]]);const c=diaCalc(tr);const cust=(state.jor[browseL]&&state.jor[browseL][name])?" <span class='chip di'>guardado</span>":"";
      return `<div class="item" data-gkey="${browseL}|${name}"><div class="mid"><div class="t1">${name}${cust}</div><div class="t2">${j[name].length} serv · ${hhmm(c.horas)}${c.noct>0.01?" · noct "+hhmm(c.noct):""}</div></div><div class="r">&#8250;</div></div>`;}).join("");

  }

  if(!ss.length)rows='<div class="empty">Sin servicios aquí.</div>';
  return `${IMPBTN}<div class="card"><div class="fields"><div class="field"><label>Línea</label><select id="bL">${lopts}</select></div><div class="field"><label>Tipo de día</label><select id="bT">${topts}</select></div></div></div><div class="card">${rows}</div><p class="hint">Toca un servicio para editar sus horas. “+ Nuevo servicio” para crear uno que no esté.</p>`;
}

function apuntarDiaTramos(fecha,tramoList,lab){
  if(!fecha){toast("Elige el día");return false;}
  const list=tramoList.filter(t=>t[1]&&t[2]);if(!list.length){toast("Falta el horario");return false;}
  const bloques=list.map(t=>({man:{l:t[0]||"",ini:t[1],fin:t[2]}}));
  const tramos=list.map(t=>[t[1],t[2]]);
  const e={id:uid(),fecha,tipo:tipoForDate(fecha),bloques,dietas:diaDietas(tramos),lab:lab||""};
  state.registro.push(e);save();if(!inPeriod(fecha))period=periodFromDate(fecha);return true;
}

  function renderG(){

    calcG();
  }

    const tr=GTR.filter(t=>t[1]&&t[2]).map(t=>[t[0]||"",t[1],t[2]]);if(!tr.length){toast("Pon al menos un servicio");return;}
    if(name&&name!==nm&&state.jor[group]&&state.jor[group][name])delete state.jor[group][name];
    state.jor[group]=state.jor[group]||{};state.jor[group][nm]=tr;save();closeSheet();render();toast("Guardada "+nm);
  };
  renderG();
}
function editServicio(key){
  let l=browseL,t=browseT,s="";let sd=null;
  if(key){const p=key.split("|");l=p[0];t=p[1];s=p[2];sd=catSd(l,t,s);}
  sd=sd||{};const a=sd.t1||["",""],b=sd.t2||["",""];
  openSheet(`<div class="grab"></div><h2>${key?"Editar":"Nuevo"} servicio</h2>
   <div class="fields"><div class="field"><label>Línea</label><input id="s_l" value="${l}"></div>
   <div class="field"><label>Tipo de día</label><select id="s_t">${["Lab","Sab","Fest"].map(x=>`<option value="${x}" ${x===t?"selected":""}>${TIPOL[x]}</option>`).join("")}</select></div>
   <div class="field full"><label>Nº servicio</label><input id="s_s" value="${s}"></div></div>
   <div style="font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 4px">Turno 1 · mañana</div>
   <div class="fields"><div class="field"><label>Inicio</label><input id="s_i1" type="time" value="${a[0]}"></div><div class="field"><label>Fin</label><input id="s_f1" type="time" value="${a[1]}"></div></div>
   <div style="font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 4px">Turno 2 · tarde</div>
   <div class="fields"><div class="field"><label>Inicio</label><input id="s_i2" type="time" value="${b[0]}"></div><div class="field"><label>Fin</label><input id="s_f2" type="time" value="${b[1]}"></div></div>
   <p class="hint">Rellena uno o los dos turnos. Se guarda y aparece al elegir esa línea y servicio.</p>
   <div style="font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 4px">Apuntar en un día</div>
   <div class="fields" style="align-items:end"><div class="field"><label>Día</label><input id="s_fecha" type="date" value="${defaultFecha()}"></div><div class="field"><label>Turno</label><select id="s_turno"><option value="1">Turno 1</option><option value="2">Turno 2</option><option value="P">Partida</option></select></div></div>
   <button class="addbtn" id="s_ap" style="background:var(--dieta);color:#fff;border-style:solid;border-color:var(--dieta);margin-top:8px">Apuntar este día</button>
   <div class="actions">${key&&state.serv[key]?'<button class="btn danger" id="s_del">Borrar</button>':''}<button class="btn ghost" id="s_c">Cancelar</button><button class="btn primary" id="s_sv">Guardar</button></div>`);
  document.getElementById("s_c").onclick=closeSheet;
  document.getElementById("s_ap").onclick=()=>{const L=val("s_l").trim(),T=val("s_t"),S=val("s_s").trim();const sd=state.serv[L+"|"+T+"|"+S]||catSd(L,T,S);if(!sd){toast("Guarda primero el servicio");return;}const trs=turnoTramos(sd,val("s_turno"));if(!trs.length){toast("Ese turno no tiene horario");return;}const tr=trs.map(t=>[L+"/"+S,t[0],t[1]]);if(apuntarDiaTramos(val("s_fecha"),tr,L+" · "+S)){closeSheet();render();toast("Apuntado en Días");}};
  if(document.getElementById("s_del"))document.getElementById("s_del").onclick=()=>{delete state.serv[key];save();closeSheet();render();toast("Borrado");};
  document.getElementById("s_sv").onclick=()=>{
    const L=val("s_l").trim(),T=val("s_t"),S=val("s_s").trim();if(!L||!S){toast("Pon línea y nº");return;}
    const i1=val("s_i1"),f1=val("s_f1"),i2=val("s_i2"),f2=val("s_f2");
    const nsd={p:(i1&&i2)?1:0};if(i1&&f1)nsd.t1=[i1,f1];if(i2&&f2)nsd.t2=[i2,f2];
    if(!nsd.t1&&!nsd.t2){toast("Pon al menos un turno");return;}
    if(key&&key!==L+"|"+T+"|"+S&&state.serv[key])delete state.serv[key];
    state.serv[L+"|"+T+"|"+S]=nsd;browseL=L;browseT=T;save();closeSheet();render();toast("Guardado");
  };
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
document.getElementById("pprev").onclick=()=>{shiftPeriod(-1);render();};
document.getElementById("pnext").onclick=()=>{shiftPeriod(1);render();};
document.getElementById("fab").onclick=()=>{if(tab==="servicios"){if(isGrupo(browseL))editGrupo(browseL,null);else editServicio(null);}else{if(tab!=="dias"){tab="dias";render();}editDia(null);}};
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
